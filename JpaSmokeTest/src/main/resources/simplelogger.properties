# Keep the harness output readable: the sections and diagnostics are the report.
# Hibernate's bootstrap chatter, and the expected FK-violation errors the guard
# sections deliberately provoke, would otherwise bury it.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.hibernate=error
org.slf4j.simpleLogger.log.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off
